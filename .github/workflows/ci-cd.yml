name: Mosaic CI/CD

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: Run Tests and Linting
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: test_mosaic_db
          POSTGRES_USER: test_mosaic_user
          POSTGRES_PASSWORD: test_mosaic_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install flake8
      
      - name: Run Flake8 Linting
        run: |
          # Stop build if there are Python syntax errors or undefined names flake8 backend --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all errors as warnings
          flake8 backend --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run Django Tests
        env:
          SECRET_KEY: test-secret-key-ci
          DEBUG: "True"
          DATABASE_URL: postgresql://test_mosaic_user:test_mosaic_password@localhost:5432/test_mosaic_db
          ALLOWED_HOSTS: localhost,127.0.0.1
          OCR_PROVIDER: placeholder
          GOOGLE_OAUTH_CLIENT_ID: test-google-client-id
          GEMINI_CLAIM_MODEL: gemini-3.6-flash
          GEMINI_OCR_MODEL: gemini-3.6-flash
        run: |
          cd backend
          python manage.py test

  docker-build:
    name: Build Docker Images
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image (Cache check)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: false
          tags: mosaic-backend:latest
          
  deploy:
    name: Deploy to Render
    needs: [test, docker-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Render Deploy Hook
        run: |
          curl --fail -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"