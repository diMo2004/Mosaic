version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: mosaic-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: mosaic_db
      POSTGRES_USER: mosaic_user
      POSTGRES_PASSWORD: mosaic_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: mosaic-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: mosaic-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - SECRET_KEY=local-dev-secret-key
      - ALLOWED_HOSTS=localhost,127.0.0.1,backend
      - DATABASE_URL=postgres://mosaic_user:mosaic_password@db:5432/mosaic_db
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - OCR_PROVIDER=placeholder
    depends_on:
      - db
      - redis
    volumes:
      - ./backend:/app

volumes:
  postgres_data: